apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

replicas:
  - name: nginx-deployment
    count: 5
  - name: redis-deployment
    count: 2

configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=pre-production
      - LOG_LEVEL=warn
