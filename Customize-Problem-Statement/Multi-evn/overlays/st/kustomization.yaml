apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stg

resources:
  - ../../base

replicas:
  - name: nginx-deployment
    count: 2
  - name: redis-deployment
    count: 1

configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=info
